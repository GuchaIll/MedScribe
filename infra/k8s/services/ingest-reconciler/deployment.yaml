# Ingest reconciler (T2, #92): lease expiry (5 s), outbox relay (1 s),
# repair (60 s). Two replicas share every loop through FOR UPDATE SKIP LOCKED,
# so there is no leader election.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medscribe-ingest-reconciler
  namespace: medscribe
  labels:
    app.kubernetes.io/name: medscribe-ingest-reconciler
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: medscribe-ingest-reconciler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medscribe-ingest-reconciler
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Lease expiry must keep running if the broker is slow. The process
      # does that on its own thread; this pod still has to start from the
      # Python image, not the Go gateway image.
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: migrate
          image: ghcr.io/medscribe/server:latest
          workingDir: /app
          command: ["python", "-m", "app.ingest", "migrate"]
          envFrom:
            - configMapRef:
                name: medscribe-config
            - secretRef:
                name: medscribe-secrets
      containers:
        - name: ingest-reconciler
          # Python server image (server/Dockerfile), not ghcr.io/medscribe/api.
          image: ghcr.io/medscribe/server:latest
          workingDir: /app
          command: ["python", "-m", "app.ingest", "reconciler"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: metrics
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: medscribe-config
            - secretRef:
                name: medscribe-secrets
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
